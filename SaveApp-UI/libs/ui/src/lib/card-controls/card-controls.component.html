<!-- Card's buttons for card actions -->
<div class="control" [class.has-unsynced]="showSyncStatus && !isSynced">
  <span
    *ngIf="showSyncStatus && !isSynced"
    class="sync-status"
    aria-label="Not synced with server"
    title="Not synced with server"
    role="img"
  ></span>
  <!-- Edit -->
  <div
    class="btn"
    (click)="edited.emit()"
    [class.green]="isReadOnly"
    [class.save]="!isReadOnly"
  ></div>
  <!-- Tool Box -->
  <div class="yellow btn" (click)="toolBoxToggled.emit()"></div>
  <!-- Delete -->
  <div class="red btn" (click)="deleted.emit()"></div>
</div>
