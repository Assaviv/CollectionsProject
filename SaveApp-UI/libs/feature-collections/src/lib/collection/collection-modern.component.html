<div
  (click)="openCollection()"
  [@cardAnimation]="cardState"
>

  <div
    class="body"
    [ngStyle]="{ 'background-color': collection.backgroundColor ?? 'var(--app-collections-card-background, white)' }"
  >
    <save-app-card-controls
      [isReadOnly]="true"
      [showSyncStatus]="false"
      (deleted)="delete()"
    ></save-app-card-controls>
    <h4 class="title">{{ collection.title }}</h4>
    <div class="hover-show">
      <p>{{ collection.description }}</p>
    </div>
  </div>
</div>
