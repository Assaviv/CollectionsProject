<main class="mobile-shell" [ngClass]="theme.bgcolor()" [class.waves-enabled]="wavesEnabled()">
  <save-app-mobile-header
    [hasAccess]="auth.hasAccess"
    [username]="auth.username"
    [hasUnsyncedChanges$]="hasUnsyncedChanges$"
    (signIn)="login()"
    (signOut)="logout()"/>

  <section class="content" aria-live="polite" [class.content--settings]="activeSection === 'settings'" [class.content--search]="activeSection === 'search'">
    <save-app-mobile-section-heading
      [title]="activeSection === 'collections' ? 'Collections' : activeSection === 'cards' ? ((selectedCollectionTitle$ | async) ?? 'Cards') : activeSection === 'search' ? 'Search' : activeSection === 'analytics' ? 'Analytics' : 'Settings'"
      [showAddButton]="activeSection === 'cards'"
      [showAssistantAvatar]="activeSection === 'search'"
      (add)="input.changeToNextInput()"
    />

    <div class="session-body" [ngSwitch]="activeSection">
    <ng-container *ngSwitchCase="'collections'">
      <p class="section-note">Everything you want to keep, in one place.</p>
      <save-app-mobile-collections-view class="panel collections-panel" [collections]="genericCollections" [wavesEnabled]="wavesEnabled()" />
    </ng-container>

    <save-app-mobile-cards-section
      *ngSwitchCase="'cards'"
      [collectionId]="selectedId$ | async"
      [cards]="(cards$ | async) ?? []"
      [wavesEnabled]="wavesEnabled()"
      (swipeLeft)="selection.selectNext()"
      (swipeRight)="selection.selectPrevious()"/>

    <save-app-vector-search *ngSwitchCase="'search'" class="panel search-panel" [class.waves-enabled]="wavesEnabled()" />

    <section *ngSwitchCase="'analytics'" class="panel feature-panel">
      <ng-container *ngIf="auth.hasAccess; else analyticsLogin"><img src="icons/data-analytics.png" alt="" /><h2>Collection analytics</h2><p>Analytics is coming soon.</p></ng-container>
      <ng-template #analyticsLogin><save-app-login-required feature="analytics" /></ng-template>
    </section>

    <save-app-mobile-settings *ngSwitchCase="'settings'" class="panel"
      [hasAccess]="auth.hasAccess"
      [username]="auth.username"
      [wavesEnabled]="wavesEnabled()"
      [selectedTheme]="theme.bgcolor()"
      [themes]="themes"
      (signIn)="login()"
      (signOut)="logout()"
      (wavesChanged)="setWavesEnabled($event)"
      (themeChanged)="setTheme($event)"/>

    </div>
  </section>

  <save-app-mobile-bottom-nav 
    [items]="navItems"
    [activeSection]="activeSection"
    (sectionSelected)="setSection($event)"
    [disabled]="(disabledSections$ | async) ?? []"/>

</main>
