<div class="view" [ngClass]="theme.bgcolor()">
  <div class="header"> 
      <h1 class="title">Save App</h1>
      <span *ngIf="auth.hasAccess" class="account-name">{{ auth.username }}</span>
      <button *ngIf="auth.hasAccess" type="button" class="account-action" aria-label="Sign out" (click)="logout()">Sign out</button>
      <button *ngIf="!auth.hasAccess" type="button" class="account-action" (click)="login()">Sign in</button>
      <span
        *ngIf="hasUnsyncedChanges$ | async"
        class="sync-status-icon"
        role="img"
        aria-label="There are unsynced changes"
        title="There are unsynced changes"
      ></span>
  </div>

  
  <save-app-cards-view
    *ngIf="activeSidePanel === 'cards'"
    class="list"
    collectionsUiSwipe="both"
    (swipeLeft)="selection.selectNext()"
    (swipeRight)="selection.selectPrevious()"
    (swipeUp)="input.changeToNextInput()"
    (swipeDown)="input.changeToPreviousInput()"
    [collectionId]="selectedId$ | async"
    [cards]="(cards$ | async) ?? []"
  />

  <save-app-input-host 
    *ngIf="activeSidePanel === 'cards'"
    class="input"
  />

  <save-app-collections-view-modern
    *ngIf="activeSidePanel === 'collections'"
    class="collections"
    [collections]="genericCollections"
  />

  <save-app-vector-search
    *ngIf="activeSidePanel === 'search'"
    class="collections"
  />

  <save-app-nav-tabs
    class="controls"
    [items]="navItems"
    [active]="activeSidePanel"
    orientation="horizontal"
    (selected)="setSidePanel($event)"
  />

</div>
