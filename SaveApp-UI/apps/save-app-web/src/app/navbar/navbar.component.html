<div class="navbar">
  <img class="logo" src="save-app.png" alt="" />
  <span href="#" class="app-name">SaveApp</span>
  <a href="#">About</a>
  <div class="right-controls">
    <span *ngIf="authenticated" class="username">{{ username }}</span>
    <div class="theme-picker">
      <button
        class="themes-button"
        type="button"
        aria-label="Themes"
        title="Themes"
        aria-haspopup="true"
        [attr.aria-expanded]="themesOpen"
        (click)="toggleThemes()"
      >
        <img class="themes-icon" src="icons/night-mode.png" alt="" />
      </button>
      <div class="theme-menu" *ngIf="themesOpen" role="menu" aria-label="Available themes">
        <button type="button" role="menuitem" class="theme-option" (click)="click('electric-violet')">
          <span class="color-swatch electric-violet" aria-hidden="true"></span>
          Electric Violet
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('juicy-orange')">
          <span class="color-swatch juicy-orange" aria-hidden="true"></span>
          Juicy Orange
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('mojito')">
          <span class="color-swatch mojito" aria-hidden="true"></span>
          Mojito
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('cherry')">
          <span class="color-swatch cherry" aria-hidden="true"></span>
          Cherry
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('modern-bg')">
          <span class="color-swatch modern-bg" aria-hidden="true"></span>
          Modern
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('dark-mode')">
          <span class="color-swatch dark-mode" aria-hidden="true"></span>
          Dark Mode
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('elemental')">
          <span class="color-swatch elemental" aria-hidden="true"></span>
          Elemental
        </button>
        <button type="button" role="menuitem" class="theme-option" (click)="click('elemental-dark')">
          <span class="color-swatch elemental-dark" aria-hidden="true"></span>
          Elemental Dark
        </button>
      </div>
    </div>
    <span
      *ngIf="hasUnsyncedChanges$ | async"
      class="sync-status-icon"
      role="img"
      aria-label="There are unsynced changes"
      title="There are unsynced changes"
    ></span>
    <button *ngIf="authenticated"
        class="logout-button"
        type="button"
        aria-haspopup="true"
        (click)="logout()">
        <img class="login-icon" src="icons/exit.png" alt="" />
    </button>
    <button *ngIf="!authenticated" class="login-button" type="button" (click)="login()">Sign in</button>
  </div>
</div>
