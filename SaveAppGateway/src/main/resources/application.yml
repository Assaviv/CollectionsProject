server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: collections
              uri: ${COLLECTIONS_DB_URL:}
              predicates:
                - Path=/api/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://localhost:4200"
                  - "https://save-app-web-save-app.dev.localhost:4200/"
                  - "https://localhost"          # Capacitor Android
                  - "capacitor://localhost"
                  - "https://jellyfish.saola-agama.ts.net/"
                allowedMethods: "*"
                allowedHeaders: "*"

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    trust-bundle: ${KEYCLOAK_TRUST_BUNDLE:}

management:
  endpoints:
    web:
      exposure:
        include: health