<div cdkDropList (cdkDropListDropped)="dropCard($event)">
  <div *ngIf="cards.length; else emptyList">
    <ng-container *ngFor="let card of cards; trackBy: trackByCardId">
      <div cdkDrag cdkDragBoundary=".list" class="dragable">
        <div cdkDragHandle class="drag-handle">
          <save-app-card [card]="card"> </save-app-card>
        </div>
      </div>
    </ng-container>
  </div>

  <ng-template #emptyList>
    <div class="emptyList">
      <img src="logo.png" />
      <p>
        Its seem like you've got<br />
        an empty canvas!
      </p>
    </div>
  </ng-template>
</div>
