<div class="tool-box" [@fadeInOut]>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  />
  <button (click)="copied.emit()" class="tool-box-button">
    <i class="fas fa-copy"></i>
  </button>
  <button (click)="archived.emit()" class="tool-box-button">
    <i class="fas fa-archive"></i>
  </button>
  <button (click)="shared.emit()" class="tool-box-button">
    <i class="fas fa-share"></i>
  </button>
  <button (click)="starred.emit()" class="tool-box-button">
    <i class="fas fa-star"></i>
  </button>
</div>
