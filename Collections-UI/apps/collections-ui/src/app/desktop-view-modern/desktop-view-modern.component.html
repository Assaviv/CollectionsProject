<div class="view" [ngClass]="theme.bgcolor()">
  <!-- Navigation bar -->
  <collections-ui-navbar class="header"></collections-ui-navbar>

  <!-- List view -->
  <collections-ui-cards-view
    class="list"
    [collectionId]="selectedId$ | async"
    [cards]="(cards$ | async) ?? []"
  ></collections-ui-cards-view>

    <collections-ui-collections-view-modern
      *ngIf="activeSidePanel === 'collections'"
      class="collections"
      [collections]="genericCollections"
    >
    </collections-ui-collections-view-modern>

    <collections-ui-collection-analytics
      *ngIf="activeSidePanel === 'analytics'"
      class="collections"
    ></collections-ui-collection-analytics>

    <collections-ui-vector-search
      class="collections"
      style="border-right: 1px solid #996633;"
      [class.panel-hidden]="activeSidePanel !== 'search'"
    ></collections-ui-vector-search>

  <!-- Input container -->
   <collections-ui-input-host class="input"></collections-ui-input-host>

  <collections-ui-side-bar
    class="controls"
    [activeView]="activeSidePanel"
    (viewChange)="setSidePanel($event)"
  ></collections-ui-side-bar>
</div>
