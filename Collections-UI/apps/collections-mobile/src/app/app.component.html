<div class="view" [ngClass]="theme.bgcolor()">
  <div class="header"> 
      <h1 class="title">Save App</h1>
  </div>

  <collections-ui-cards-view
    class="list"
    [collectionId]="selectedId$ | async"
    [cards]="(cards$ | async) ?? []"
  ></collections-ui-cards-view> 

  <collections-ui-input-host class="input"></collections-ui-input-host>

  <collections-ui-side-bar
    class="controls"
    [activeView]="activeSidePanel"
    (viewChange)="setSidePanel($event)">
  </collections-ui-side-bar>

</div>
