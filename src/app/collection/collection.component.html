<div
  class="card flex-row-container"
  (click)="openCollection()"
  [@cardAnimation]="cardState"
>
  <collections-ui-card-controls
    [isReadOnly]="true"
    [delete]="delete.bind(this)"
  ></collections-ui-card-controls>

  <div
    class="body"
    [ngStyle]="{ 'background-color': backgroundColor ?? 'white' }"
  >
    <label class="emoji">{{ emoji }}</label>
    <h4 class="title">{{ title }}</h4>
    <div class="hover-show">
      <p>{{ description }}</p>
    </div>
  </div>
</div>
