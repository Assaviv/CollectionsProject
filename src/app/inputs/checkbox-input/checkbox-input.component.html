<form
  [formGroup]="inputForm"
  (ngSubmit)="submit()"
  class="form"
  [@cardAnimation]="cardState"
>
  <div class="card">
    <input
      type="text"
      class="inputBox"
      placeholder="Type a new prompt..."
      formControlName="keyInput"
    />
    <input type="checkbox" class="checkBox" formControlName="valueInput" />
    <div class="control">
      <button type="submit" class="submit">Submit</button>
    </div>
  </div>
</form>
