<form [formGroup]="inputForm" (ngSubmit)="submit()" class="form">
  <div class="card">
    <input
      type="text"
      class="inputBox"
      placeholder="KV card key"
      formControlName="keyInput"
    />
    <input
      type="text"
      class="inputBox"
      placeholder="KV card value"
      formControlName="valueInput"
    />
    <div class="control">
      <button type="submit" class="submit">Submit</button>
    </div>
  </div>
</form>
