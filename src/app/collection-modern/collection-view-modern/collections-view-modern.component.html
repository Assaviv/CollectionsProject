<div cdkDropList class="collections">
  <div class="collections-toolbar" aria-label="Collection tools">
    <label class="search-box">
      <img src="/assets/icons/search.png" alt="" />
      <input
        type="search"
        placeholder="Search collections"
        aria-label="Search collections"
        [value]="searchQuery"
        (input)="onSearchChange($any($event.target).value)"
      />
    </label>
    <div class="toolbar-actions">
      <button
        type="button"
        class="toolbar-button"
        [class.active]="editMode"
        [attr.aria-pressed]="editMode"
        aria-label="Edit collections"
        title="Edit collections"
        (click)="editMode = !editMode"
      >
        <img src="/assets/icons/edit.png" alt="" />
      </button>
      <button
        type="button"
        class="toolbar-button"
        aria-label="Sync collections"
        title="Sync collections"
        (click)="syncCollections()"
      >
        <img src="/assets/icons/sync.png" alt="" />
      </button>
    </div>
  </div>
  <ng-container *ngFor="let collection of filteredCollections$ | async">
    <collections-ui-collection-modern
      class="collection-list-item"
      [collection]="collection"
      [ngClass]="{
        selectedCollection: collection.id === selectedCollection,
      }"
    >
    </collections-ui-collection-modern>
  </ng-container>
</div>
