<div class="blur">
  <div class="popup">
    <div class="btn" mat-button [mat-dialog-close]="true"></div>
    <div class="header">
      <h2 class="banner-text">Begin Your Collection Journey 🤠</h2>
    </div>

    <div class="editor">
      <!-- Colors column -->
      <div class="colors">
        <div
          (click)="setColor('#FFFFFF')"
          class="circle"
          style="background-color: white"
        ></div>
        <div
          (click)="setColor('#e0ffcb')"
          class="circle"
          style="background-color: #e0ffcb"
        ></div>
        <div
          (click)="setColor('#b3ffcd')"
          class="circle"
          style="background-color: #b3ffcd"
        ></div>
        <div
          (click)="setColor('#fac2ff')"
          class="circle"
          style="background-color: #fac2ff"
        ></div>
        <div
          (click)="setColor('#b0aaff')"
          class="circle"
          style="background-color: #b0aaff"
        ></div>
        <div
          (click)="setColor('#ffe997')"
          class="circle"
          style="background-color: #ffe997"
        ></div>
      </div>

      <!-- Emojis coulmn -->
      <div class="emojis">
        <collections-ui-emoji-box
          emoji="{{ chosenEmoji ?? '❓' }}"
          (click)="showPicker()"
        >
        </collections-ui-emoji-box>
        <collections-ui-emoji-box emoji="🤠"></collections-ui-emoji-box>
        <collections-ui-emoji-box emoji="🧭"></collections-ui-emoji-box>
        <collections-ui-emoji-box emoji="🥩"></collections-ui-emoji-box>
        <collections-ui-emoji-box emoji="🦊"></collections-ui-emoji-box>
        <collections-ui-emoji-box emoji="🤌"></collections-ui-emoji-box>
        <div *ngIf="showEmojiPicker">
          <emoji-mart
            [showSingleCategory]="false"
            class="emoji-picker"
            title="Pick up"
            emoji="point_up"
            set="apple"
            [darkMode]="false"
            [autoFocus]="true"
            [perLine]="8"
            (emojiSelect)="emojiClicked($event)"
          ></emoji-mart>
        </div>
      </div>

      <div class="title">
        <h1>Collection Editor</h1>
      </div>

      <div class="preview">
        <collections-ui-collection
          [collectionType]="0"
          [title]="title"
          [description]="description"
          [emoji]="emoji"
          [backgroundColor]="backgroundColor"
          id="demo"
        >
        </collections-ui-collection>

        <form class="cui-form" [formGroup]="collectionForm">
          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              placeholder="Collection Title"
              formControlName="title"
            />
            <!-- <div style="color: red">
                {{ isFieldValid('title') }}
              </div> -->
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              class="form-control"
              id="description"
              placeholder="Collection Description"
              formControlName="description"
            />
            <!-- <div style="color: red">
                  {{ isFieldValid('description') }}
                </div> -->
          </div>

          <button
            type="submit"
            color="primary"
            class="submit-button"
            (click)="submitForm()"
            [disabled]="collectionForm.invalid"
          >
            Create Collection
          </button>
        </form>
      </div>

      <div class="slidebars">
        <mat-slider
          class="mat-slider"
          min="0"
          max="180"
          step="5"
          value="30"
          discrete
          [displayWith]="formatDegreesLabel"
        >
          <input type="range" matSliderThumb />
        </mat-slider>
        <mat-slider
          min="12"
          max="72"
          step="2"
          value="12"
          discrete
          [displayWith]="formatSizeLabel"
        >
          <input type="range" matSliderThumb />
        </mat-slider>
      </div>

      <div class="tags">
        <mat-form-field
          class="tag-chip-list"
          appearance="fill"
          hintLabel="The tags are used for search and analytics, thus they're important."
        >
          <mat-label>Collection tags</mat-label>
          <mat-chip-grid #chipGrid aria-label="Enter tags">
            <mat-chip-row
              *ngFor="let tag of tags"
              (removed)="remove(tag)"
              [editable]="true"
              (edited)="edit(tag, $event)"
            >
              {{ tag }}
              <button matChipRemove [attr.aria-label]="'remove ' + tag">
                <mat-icon>cancel</mat-icon>
              </button>
            </mat-chip-row>
            <input
              placeholder="New tag..."
              [matChipInputFor]="chipGrid"
              [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
              [matChipInputAddOnBlur]="addOnBlur"
              (matChipInputTokenEnd)="add($event)"
            />
          </mat-chip-grid>
        </mat-form-field>
      </div>

      <div class="card-types">
        <collections-ui-card
          *ngFor="let num of [0, 1, 2, 3, 4]"
          [card]="{
            cardType: num,
            key: 'Hello',
            value: 'world',
            id: 'demo',
          }"
        >
        </collections-ui-card>
        <collections-ui-card
          [card]="{
            cardType: 5,
            key: 'Hello world',
            value: '../../assets/logo.png',
            id: 'demo',
          }"
        >
        </collections-ui-card>
      </div>
    </div>

    <!-- <div class="flex-row-container">
      
       -->
    <!-- </div> -->
  </div>
</div>
