<div class="blur">
  <div class="popup">
    <div class="btn" mat-button [mat-dialog-close]="true"></div>
    <div class="header">
      <h2 class="title">Begin Your Collection Journey 🤠</h2>
    </div>
    <p>Every collection contains a unique title and a description</p>
    <div class="flex-row-container">
      <div class="collection-form">
        <form class="cui-form" [formGroup]="collectionForm">
          <h3 style="margin-top: 0; align-self: flex-start">
            Setup a collection
          </h3>
          <button type="checkbox" (click)="showPicker()" class="emoji-button">
            {{ chosenEmoji }}
          </button>
          <div *ngIf="showEmojiPicker">
            <emoji-mart
              [showSingleCategory]="true"
              class="emoji-picker"
              title="Pick up"
              emoji="point_up"
              set="apple"
              [darkMode]="false"
              [autoFocus]="true"
              [perLine]="8"
              (emojiSelect)="emojiClicked($event)"
            ></emoji-mart>
          </div>

          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              placeholder="Collection Title"
              formControlName="title"
            />
            <!-- <div style="color: red">
              {{ isFieldValid('title') }}
            </div> -->
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              class="form-control"
              id="description"
              placeholder="Collection Description"
              formControlName="description"
            />
            <!-- <div style="color: red">
                {{ isFieldValid('description') }}
              </div> -->
          </div>

          <button
            type="submit"
            color="primary"
            class="submit-button"
            (click)="submitForm()"
          >
            Create Collection
          </button>
        </form>
      </div>
      <div class="preview">
        <h2>Live preview:</h2>
        <collections-ui-collection
          [collectionType]="0"
          [title]="title"
          [description]="description"
          [emoji]="emoji"
          id="demo"
        >
        </collections-ui-collection>
      </div>
    </div>
  </div>
</div>
