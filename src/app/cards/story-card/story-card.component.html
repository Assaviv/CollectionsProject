<div class="card" [@cardAnimation]="cardState">
  <div class="flex-row-container">
    <h2 class="data-container">{{ key }}</h2>
    <div class="control">
      <div class="btn" (click)="delete()"></div>
    </div>
  </div>
  <hr />
  <div class="body">
    <p class="data">{{ value }}</p>
  </div>
</div>
