<div
  class="card flex-row-container"
  [ngStyle]="{ width: card.id === 'demo' ? 'inherit' : '65vh' }"
  [@cardAnimation]="cardState"
>
  <p class="topic key">{{ card.key }}</p>
  <img class="image" [src]="card.value" />
  <div class="control">
    <div class="btn" (click)="delete()"></div>
  </div>
</div>
