<div
  class="card flex-row-container"
  [ngStyle]="{ width: id === 'demo' ? 'inherit' : '65vh' }"
  [@cardAnimation]="cardState"
>
  <button
    class="subject data-container"
    ngClass="{{ value ? 'checked' : 'unchecked' }}"
    (click)="changeState()"
  >
    {{ key }}
  </button>
  <div class="control">
    <div class="btn" (click)="delete()"></div>
  </div>
</div>
